
<!DOCTYPE html>
<html>
<head>
    <title>China's Tourism Map</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff8ef;
            color: #333;
        }

        header {
            background-image: linear-gradient(
                rgba(100, 0, 0, 0.65),
                rgba(100, 0, 0, 0.65)
            ), url("https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&w=1400&q=80");
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            padding: 40px 10px;
        }

        header h1 {
            font-size: 40px;
        }

        nav {
            background-color: #9b1717;
            text-align: center;
            padding: 18px 5px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffd700;
        }

        main {
            padding: 30px 15px;
            text-align: center;
        }

        h2 {
            color: #a51c1c;
            font-size: 30px;
        }

        p {
            line-height: 1.6;
        }

        .map-container {
            max-width: 900px;
            margin: 25px auto;
            padding: 12px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #cccccc;
        }

        iframe {
            width: 100%;
            height: 450px;
            border: 0;
            border-radius: 8px;
        }

        .map-button {
            display: inline-block;
            background-color: #9b1717;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 6px;
            margin: 15px;
        }

        .map-button:hover {
            background-color: #c52a2a;
        }

        footer {
            background-color: #9b1717;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 30px;
            }

            nav a {
                display: inline-block;
                margin: 8px;
            }

            iframe {
                height: 350px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>China Location Map</h1>
        <h3>Find Beijing, China</h3>
    </header>

    <!-- MENU -->
    <nav>
        <a href="index.html">HOME</a> |
        <a href="touristspot.html">TOURIST SPOT</a> |
        <a href="gallery.html">GALLERY</a> |
        <a href="map.html">MAP</a> |
        <a href="about.html">ABOUT US</a>
    </nav>

    <!-- MAIN CONTENT -->
    <main>

        <h2>Where is China?</h2>

        <p>
            Explore China and discover its beautiful places
            using the map below.
        </p>

        <!-- GOOGLE MAP -->
        <div class="map-container">
            <iframe
                src="https://maps.google.com/maps?q=Beijing%2C%20China&output=embed"
                loading="lazy"
                allowfullscreen
                title="Google Map of Beijing, China">
            </iframe>
        </div>

        <a class="map-button"
           href="https://www.google.com/maps/search/?api=1&query=Beijing%2C+China"
           target="_blank">
            Open Google Maps
        </a>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>Author: Ma. Cristina Encontro</p>
        <p>Year: 2026 | Place: China</p>
        <p>&copy; 2026 China. All Rights Reserved.</p>
    </footer>

</body>
</html>
